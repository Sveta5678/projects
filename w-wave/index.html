<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="img/favicon.svg" type="image/x-icon">

    <title>W-wave</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <img class="header__logo" src="img/logo.svg" alt="" />
        
        <nav class="nav">
          <ul class="nav__list list-reset">
            <li class ="nav__item">
              <a  class="nav__link" href="">Подкасты</a>
            </li>
            <li class ="nav__item">
              <a  class="nav__link" href="">Передачи</a>
            </li>
            <li class ="nav__item">
              <a  class="nav__link" href="">Гости</a>
            </li>
            <li class ="nav__item">
              <a  class="nav__link" href="">Плейлисты</a>
            </li>
            <li class ="nav__item">
              <a  class="nav__link" href="">О нас</a>
            </li>
            
          </ul>
        </nav>
        <button class="header__search btn-reset">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
              stroke="#6D31EE"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M21 21L16.65 16.65"
              stroke="#6D31EE"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__content hero__microphone">
            <h1 class="hero__title">Радио 
              <em class="hero__title-cursive" >W-Wave</em>
             </h1>
             <p class="hero__text">
              Привет, на связи W-Wave! Раньше мы были изданием, а теперь пробуем себя в разоворном жанре. Говорим о музыке, политике, истории, науке и культуре. Здесь, помимо прямого эфира — архив передач и многое другое:)
             </p>
             <button class="hero__btn btn-reset">Слушать эфир</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
